<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Morse Fall Scale Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column clinical workbook. Top bar, then one screen at a time: sign-in, scenario hub, case + 6-item form, paper-style report. */
:root{
  --bg:#edf2f3; --surface:#ffffff; --ink:#14262d; --muted:#566b74; --line:#d2dde1;
  --accent:#0e6a65; --accent-ink:#ffffff; --accent-soft:#dcefed;
  --good:#1d7a4b; --good-soft:#dff3e8; --warn:#9a6200; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#fbe1de;
  --sv-wall:#e6eef0; --sv-floor:#c9d6da; --sv-win:#cfe6f3; --sv-line:#7f949c; --sv-skin:#e0b48c; --sv-gown:#7fb3c8; --sv-leg:#6f8f9c;
  --sv-scrub:#1f8a7f; --sv-metal:#8fa2aa; --sv-bed:#f7fafb; --sv-warn:#f2b705; --sv-bubble:#ffffff; --sv-ink:#14262d; --sv-iv:#4aa3d8; --sv-hair:#4a3b32; --sv-pants:#8aa5b0; --sv-slip:#6b7f87; --sv-wood:#b98d62; --sv-blanket:#9ec9d6; --sv-shadow:rgba(20,38,45,.16); --sv-rail:#b5c4ca; --sv-wall2:#dbe6e9; --sv-curtain:#e9c9a8; --sv-scrub2:#17695f;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif; --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1e; --surface:#16262c; --ink:#e5eef0; --muted:#93a9b1; --line:#294048;
  --accent:#4fc3b8; --accent-ink:#06231f; --accent-soft:#17383a;
  --good:#6fd4a0; --good-soft:#143427; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --sv-wall:#1d3036; --sv-floor:#142428; --sv-win:#27485a; --sv-line:#5d7a84; --sv-skin:#c99a74; --sv-gown:#4d8aa3; --sv-leg:#3f6a7a;
  --sv-scrub:#27a89a; --sv-metal:#6f858d; --sv-bed:#2b434b; --sv-bubble:#223b43; --sv-ink:#e5eef0; --sv-hair:#8b7868; --sv-pants:#4d6975; --sv-slip:#8aa0a8; --sv-wood:#8a6a4a; --sv-blanket:#3d6f80; --sv-shadow:rgba(0,0,0,.38); --sv-rail:#4b6770; --sv-wall2:#183037; --sv-curtain:#7d5a45; --sv-scrub2:#1d7d72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1e; --surface:#16262c; --ink:#e5eef0; --muted:#93a9b1; --line:#294048;
  --accent:#4fc3b8; --accent-ink:#06231f; --accent-soft:#17383a;
  --good:#6fd4a0; --good-soft:#143427; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --sv-wall:#1d3036; --sv-floor:#142428; --sv-win:#27485a; --sv-line:#5d7a84; --sv-skin:#c99a74; --sv-gown:#4d8aa3; --sv-leg:#3f6a7a;
  --sv-scrub:#27a89a; --sv-metal:#6f858d; --sv-bed:#2b434b; --sv-bubble:#223b43; --sv-ink:#e5eef0; --sv-hair:#8b7868; --sv-pants:#4d6975; --sv-slip:#8aa0a8; --sv-wood:#8a6a4a; --sv-blanket:#3d6f80; --sv-shadow:rgba(0,0,0,.38); --sv-rail:#4b6770; --sv-wall2:#183037; --sv-curtain:#7d5a45; --sv-scrub2:#1d7d72; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
#app[dir="rtl"]{font-family:var(--f-ar)}
.wrap{max-width:880px;margin-inline:auto}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:15px;flex:none}
.brand h1{font-size:18px;line-height:1.2;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-block-end:16px}
h2{font-size:22px;margin:0 0 6px;line-height:1.25}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:14px;margin-block-end:5px}
input[type=text]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lvl{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:start;cursor:pointer;display:block;width:100%}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lvl b{display:block;font-size:17px}
.lvl span{font-size:13.5px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.who{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px}
.who span{background:var(--accent-soft);color:var(--ink);padding:4px 10px;border-radius:999px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-block:6px 14px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-block:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:start;padding:0;display:block;width:100%}
.card:hover{border-color:var(--accent)}
.card .meta{padding:12px 14px}
.card .meta b{display:block;font-size:15px;line-height:1.3}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin-block-start:6px}
.tag.todo{background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.mid{background:var(--warn-soft);color:var(--warn)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
svg.sv{display:block;width:100%;height:auto}
.hero svg.sv{border-radius:12px;border:1px solid var(--line)}
.item{border-top:1px solid var(--line);padding-block:16px}
.item h3 .n{font-family:var(--f-mono);color:var(--accent);margin-inline-end:6px}
.item p.h{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-block-end:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-block-start:4px;accent-color:var(--accent);flex:none}
.opt .pt{margin-inline-start:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}
.locked .opt{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{display:flex;gap:6px;flex-wrap:wrap;font-size:13.5px;margin-block-start:4px}
.badge{font-weight:700}
.badge.ok{color:var(--good)} .badge.no{color:var(--bad)}
.result{border-radius:12px;padding:16px;margin-block:12px;border:1.5px solid var(--line)}
.result .big{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1}
.risk-0{background:var(--good-soft)} .risk-1{background:var(--warn-soft)} .risk-2{background:var(--bad-soft)}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14.5px}
ul.act{margin:8px 0 0;padding-inline-start:20px}
.rat{border-top:1px solid var(--line);padding-block:9px;font-size:14.5px}.pt2{font-family:var(--f-mono);color:var(--accent);font-size:13px}

.form{padding-block:10px 20px}
.frow{display:grid;grid-template-columns:minmax(160px,1fr) 2.2fr;gap:8px 18px;padding-block:13px;border-top:1px solid var(--line);align-items:start}
.frow:first-child{border-top:0}
.flabel{font-weight:700;font-size:14.5px;line-height:1.35}
.req{color:var(--bad);margin-inline-end:3px}
.fopts{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14.5px;padding:3px 8px;border-radius:8px;margin-inline-start:-8px}
.chk input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:4px;background:var(--surface);margin:0;flex:none;display:grid;place-content:center;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"✓";color:var(--accent-ink);font-size:14px;line-height:1;font-weight:700}
.locked .chk,.locked .chk input{cursor:default}
.chk.right{background:var(--good-soft);color:var(--good);font-weight:600}
.chk.wrong{background:var(--bad-soft);color:var(--bad)}
details.gl{margin-block-start:4px;font-weight:400}
details.gl summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
details.gl p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;border-top:1px solid var(--line);margin-block-start:8px;padding-block-start:14px;font-size:14px}
ol.act{margin:8px 0 0;padding-inline-start:22px}
@media (max-width:640px){.frow{grid-template-columns:1fr}.legend{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:start;vertical-align:top}.tbl th{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;margin-block-start:8px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding-block:20px 6px}
.paper-wrap{overflow-x:auto}
/* The report is a printed sheet: fixed light colors so the PDF matches the screen in any theme. */
.paper{background:#fff;color:#14262d;width:100%;max-width:794px;margin-inline:auto;padding:36px 40px;border:1px solid #cfd9dd;font-family:var(--f-body)}
.paper[dir="rtl"]{font-family:var(--f-ar)}
.paper h2{font-size:24px;margin:0}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid #0e6a65;padding-bottom:12px;margin-bottom:16px}
.paper .hd small{color:#566b74;display:block}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 16px}
.paper dt{color:#566b74;font-weight:600} .paper dd{margin:0;font-weight:600}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px;margin-block:10px}
.paper th{background:#e8f0f1;text-align:start;padding:7px 8px;border:1px solid #cfd9dd}
.paper td{padding:7px 8px;border:1px solid #cfd9dd;vertical-align:top}
.paper .num{font-family:var(--f-mono)}
.paper .verdict{border:2px solid #0e6a65;border-radius:10px;padding:12px 16px;margin-block:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.paper .verdict.fail{border-color:#b3261e}
.paper .verdict b{font-size:20px}
.paper .small{font-size:12px;color:#566b74}
.paper .sig{margin-top:18px;border-top:1px solid #cfd9dd;padding-top:8px;display:flex;justify-content:space-between;font-size:12px;color:#566b74}
@media (max-width:560px){.paper{padding:22px 16px}.paper table{font-size:12px}}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .25s ease}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<style>[hidden]{display:none!important}img{max-width:100%}</style>

<div id="app" dir="ltr"><div class="wrap" id="root"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
"use strict";
/* Paste your Google Apps Script web app URL (ends with /exec) between the quotes to send results to a Google Sheet. */
let SHEET_URL='';
/* ---------- data: hospital Morse Fall Scale form ---------- */
const ITEMS=[
{q:['History of falling; immediate or within 3 months','تاريخ السقوط؛ فوري أو خلال 3 أشهر'],
 g:['Scored 25 if the patient has fallen during the present hospital admission, or has an immediate history of physiological falls (for example seizures or an impaired gait) before admission. A patient who falls for the first time is immediately scored +25.','تُعطى 25 درجة إذا سقط المريض خلال الإقامة الحالية، أو كان لديه تاريخ سقوط فسيولوجي فوري (مثل التشنجات أو اضطراب المشي) قبل الدخول. وإذا سقط المريض لأول مرة تزيد درجته فورًا بمقدار 25.'],
 o:[['No','لا'],['Yes','نعم']],p:[0,25],disp:[1,0]},
{q:['Secondary diagnosis','تشخيص ثانوي'],
 g:['15 if more than one medical diagnosis is listed on the patient chart; if not, 0.','15 إذا كان هناك أكثر من تشخيص طبي مسجل في ملف المريض، وإلا 0.'],
 o:[['No','لا'],['Yes','نعم']],p:[0,15],disp:[1,0]},
{q:['Ambulatory aid','وسيلة المشي'],
 g:['0 if the patient walks without a walking aid (even if assisted by a nurse), uses a wheelchair, or is on bed rest and does not get out of bed at all. 15 if the patient uses crutches, a cane or a walker. 30 if the patient ambulates clutching onto furniture for support.','0 إذا كان المريض يمشي دون وسيلة مساعدة (حتى لو ساعدته الممرضة)، أو يستخدم كرسيًا متحركًا، أو على راحة بالفراش ولا يغادره إطلاقًا. 15 إذا استخدم عكازات أو عصا أو مشاية. 30 إذا كان يمشي متمسكًا بالأثاث للدعم.'],
 o:[['Unassisted','دون مساعدة'],['Bed rest / Nurse assist','راحة بالفراش / مساعدة التمريض'],['Crutches / Cane / Walker','عكازات / عصا / مشاية'],['Furniture','الأثاث']],p:[0,0,15,30]},
{q:['IV / Heparin lock','قسطرة وريدية / Heparin lock'],
 g:['20 if the patient has an intravenous apparatus or a heparin lock inserted; if not, 0.','20 إذا كان لدى المريض جهاز وريدي أو heparin lock مثبت، وإلا 0.'],
 o:[['No','لا'],['Yes','نعم']],p:[0,20],disp:[1,0]},
{q:['Gait / Transferring','طريقة المشي / الانتقال'],
 g:['Normal (0): head erect, arms swinging freely at the sides, striding without hesitation. Weak (10): stooped but able to lift the head while walking without losing balance; steps are short and the patient may shuffle. Impaired (20): difficulty rising from the chair, pushing on the arms or bouncing to rise; head down, watching the ground; poor balance, so the patient grasps furniture, a support person or a walking aid and cannot walk without this assistance.','طبيعية (0): رأس مرفوع، ذراعان تتحركان بحرية، خطوات دون تردد. ضعيفة (10): انحناء مع القدرة على رفع الرأس أثناء المشي دون فقد التوازن؛ خطوات قصيرة وقد يجرّ قدميه. مختلة (20): صعوبة في النهوض من الكرسي بالدفع على الذراعين أو بالارتداد؛ الرأس منخفض والنظر إلى الأرض؛ توازن ضعيف فيتمسك بالأثاث أو بشخص داعم أو بوسيلة مشي ولا يستطيع المشي بدونها.'],
 o:[['Normal / Bed rest / Immobile','طبيعية / راحة بالفراش / غير متحرك'],['Weak','ضعيفة'],['Impaired','مختلة']],p:[0,10,20]},
{q:['Mental status','الحالة الذهنية'],
 g:['Ask the patient: "Are you able to go to the bathroom alone or do you need assistance?" If the reply is consistent with the ambulatory order on the Kardex, the patient is rated normal: 0. If the reply is not consistent with the nursing orders or is unrealistic, the patient overestimates his or her ability and forgets limitations: 15.','اسأل المريض: «هل تستطيع الذهاب إلى الحمام وحدك أم تحتاج إلى مساعدة؟» إذا كان رده متفقًا مع أمر المشي في الكاردكس فهو طبيعي: 0. وإذا لم يتفق مع أوامر التمريض أو كان غير واقعي فهو يبالغ في تقدير قدرته وينسى محدوداته: 15.'],
 o:[['Oriented to own ability','مدرك لقدرته'],['Forgets limitations','ينسى محدوداته']],p:[0,15]}
];
const RISK=[
 {r:[0,24],n:['Low risk','خطر منخفض'],c:'ok'},
 {r:[25,50],n:['Moderate risk','خطر متوسط'],c:'mid'},
 {r:[51,125],n:['High risk','خطر مرتفع'],c:'no'}];
const ACT=[
 [['Basic safety: call light in reach, bed low, clear walkway.','سلامة أساسية: جرس النداء في المتناول، السرير منخفض، ممر خالٍ.'],['Orient the patient to the room and bathroom.','تعريف المريض بالغرفة والحمام.'],['Reassess on any change in condition.','إعادة التقييم عند أي تغير في الحالة.']],
 [['Standard fall precautions and non-slip footwear.','احتياطات السقوط القياسية وحذاء غير قابل للانزلاق.'],['Teach patient and family to call before getting up.','تثقيف المريض والأسرة بطلب المساعدة قبل النهوض.'],['Check IV lines and tubing before mobilizing.','فحص الخطوط الوريدية والأنابيب قبل التحريك.'],['Reassess every shift.','إعادة التقييم كل وردية.']],
 [['High-risk fall precautions: wristband and door sign per policy.','احتياطات السقوط العالية: سوار وإشارة على الباب حسب السياسة.'],['Bed alarm on, bed in lowest position.','تفعيل منبه السرير وأخفض وضع للسرير.'],['Scheduled toileting and hourly rounding.','جدول لدخول الحمام وجولات كل ساعة.'],['Stay with the patient during transfers and walking.','البقاء مع المريض أثناء الانتقال والمشي.'],['Review medications with the pharmacist; reassess daily.','مراجعة الأدوية مع الصيدلي؛ إعادة التقييم يوميًا.']]];

const SC=[
{id:'e1',lv:'easy',ti:['Day 1 after appendectomy','اليوم الأول بعد استئصال الزائدة'],
 st:['Mr. A, 45, is on day 1 after a laparoscopic appendectomy. The chart lists one diagnosis: acute appendicitis. He walks to the bathroom alone with a steady gait and no aid. His IV was removed this morning. He has never fallen. He is alert and follows instructions.','السيد أ، 45 سنة، في اليوم الأول بعد استئصال الزائدة بالمنظار. السجل يذكر تشخيصًا واحدًا: التهاب الزائدة الحاد. يمشي إلى الحمام وحده بخطوات ثابتة ودون وسيلة مساعدة. تم سحب القسطرة الوريدية هذا الصباح. لم يسقط من قبل. واعٍ ويتبع التعليمات.'],
 a:[0,0,0,0,0,0],nt:['When every item scores 0, the total is 0: low risk. Basic safety care is enough.','عندما تكون كل البنود صفرًا يكون المجموع صفرًا: خطر منخفض. تكفي إجراءات السلامة الأساسية.'],

    else{const wk=rnd(3,10);const cz=pick([['because of dizziness','بسبب الدوخة'],['during a seizure','أثناء نوبة تشنج'],[`when ${his} legs gave way`,`عندما ${ar('خانته ساقاه','خانتها ساقاها')}`]]);pcs.push([`${He} fell at home ${wk} weeks ago ${cz[0]}.`,`${ar('سقط','سقطت')} في المنزل قبل ${wk} أسابيع ${cz[1]}.`]);}
    R6.push(GR[0][1]);props.push('fallbubble');
  }else if(Math.random()<pt){
    const mo=rnd(4,10);pcs.push([`${His} last fall was ${mo} months ago.`,`آخر سقوط ${ar('له','لها')} كان قبل ${mo} أشهر.`]);
    R6.push([`The last fall was ${mo} months ago, outside the 3-month window: 0.`,`آخر سقوط كان قبل ${mo} أشهر وهو خارج فترة الثلاثة أشهر: 0.`]);
    traps.push(['An old fall outside 3 months scores 0.','السقوط القديم خارج 3 أشهر يعطي صفرًا.']);
  }else{pcs.push([`${He} has never fallen.`,`${ar('لم يسقط','لم تسقط')} من قبل.`]);R6.push(GR[0][0]);}
  // 2 diagnosis
  const dxs=shuffle(DX).slice(0,a[1]?rnd(2,3):1);
  if(a[1]){pcs.push([`The chart lists these diagnoses: ${dxs.map(x=>x[0]).join(', ')}.`,`يذكر السجل التشخيصات التالية: ${dxs.map(x=>x[1]).join('، ')}.`]);R6.push(GR[1][1]);}
  else{pcs.push([`The chart lists one diagnosis: ${dxs[0][0]}.`,`يذكر السجل تشخيصًا واحدًا: ${dxs[0][1]}.`]);R6.push(GR[1][0]);}
  // 3 aid and mode
  let mode='';
  if(a[2]===0){
    mode=a[4]===0?pick(lv==='easy'?['none','none','bed']:['none','bed','wc','assist','assist']):pick(['none','assist']);
    if(mode==='none')pcs.push([`${He} walks without any aid.`,`${ar('يمشي','تمشي')} دون أي وسيلة مساعدة.`]);
    if(mode==='bed')pcs.push([`${He} is on strict bed rest.`,`${ar('هو','هي')} على راحة تامة بالفراش.`]);
    if(mode==='wc'){pcs.push([`${He} moves by wheelchair and a nurse assists every transfer.`,`${ar('يتنقل','تتنقل')} بكرسي متحرك وتساعد الممرضة في كل انتقال.`]);traps.push(['A wheelchair or nurse assist scores 0 for aid. It is not furniture.','الكرسي المتحرك أو مساعدة التمريض يعطي صفرًا لوسيلة المشي وليس أثاثًا.']);}
    if(mode==='assist'){pcs.push([`${He} walks only with a nurse holding ${his} arm.`,`${ar('يمشي','تمشي')} فقط والممرضة ${ar('تمسك بذراعه','تمسك بذراعها')}.`]);traps.push(['Nurse assistance is not an aid device: 0.','مساعدة التمريض ليست وسيلة مساعدة: 0.']);}
    R6.push(mode==='bed'?[`Bed rest scores 0 for ambulatory aid.`,'الراحة بالفراش تعطي صفرًا لوسيلة المشي.']:mode==='wc'?['Wheelchair with nurse assist scores 0 for aid.','الكرسي المتحرك مع مساعدة التمريض: صفر لوسيلة المشي.']:mode==='assist'?['Walking with a nurse holding the arm is nurse assist: 0.','المشي مع إمساك الممرضة بالذراع هو مساعدة تمريض: 0.']:GR[2][0]);
    if(mode==='bed')pose='lie';if(mode==='wc')pose='wc';if(mode==='wc'||mode==='assist')props.push('nurse');
  }else if(a[2]===1){
    const d=pick([['walker','مشاية','walker'],['cane','عصا','cane'],['crutches','عكازات','cane']]);
    pcs.push([`${He} walks with ${d[0]==='crutches'?'crutches':'a '+d[0]}.`,`${ar('يمشي','تمشي')} باستخدام ${d[1]}.`]);props.push(d[2]);R6.push(GR[2][2]);
  }else{
    pcs.push([`${He} has no cane or walker and holds on to the bed rail, bedside table and wall to move.`,`ليس ${ar('لديه','لديها')} عصا أو مشاية و${ar('يتمسك','تتمسك')} بحاجز السرير والطاولة الجانبية والحائط للتنقل.`]);props.push('furn');R6.push(GR[2][3]);
  }
  // 4 IV
  if(a[3]===1){
    const v=pick(pose==='lie'?['f','b']:['f','b','s','h']);
    const T={f:['IV fluids are running.','المحلول الوريدي جارٍ.'],b:['IV antibiotics are running.','المضاد الحيوي يُعطى وريديًا.'],s:[`A capped saline lock is in ${his} forearm.`,`يوجد saline lock مغلق في ${ar('ساعده','ساعدها')}.`],h:[`A heparin lock is in ${his} forearm.`,`يوجد heparin lock في ${ar('ساعده','ساعدها')}.`]}[v];
    pcs.push(T);props.push(v==='s'||v==='h'?'lock':'iv');
    R6.push(v==='s'||v==='h'?['A saline or heparin lock counts as IV access even with no fluid running: 20.','الـ saline أو heparin lock يُحسب كقسطرة وريدية حتى بلا محلول جارٍ: 20.']:GR[3][1]);
    if(v==='s'||v==='h')traps.push(['A capped lock still counts as IV access.','القفل المغلق يُحسب أيضًا كقسطرة وريدية.']);
    if(pose==='lie'&&v!=='f'&&v!=='b')props.push('iv');
  }else if(Math.random()<pt){
    pcs.push(['The IV was removed this morning and no access remains.','تم سحب القسطرة الوريدية هذا الصباح ولا توجد أي قسطرة الآن.']);
    R6.push(['The IV was removed, so there is no access now: 0.','تم سحب القسطرة فلا توجد قسطرة الآن: 0.']);traps.push(['A removed IV scores 0. Score only what is present now.','القسطرة المسحوبة تعطي صفرًا. احسب فقط ما هو موجود الآن.']);
  }else{pcs.push([`${He} has no IV line.`,`ليس ${ar('لديه','لديها')} أي قسطرة وريدية.`]);R6.push(GR[3][0]);}
  // 5 gait
  if(a[4]===0){
    if(mode==='none'||mode===''||mode==='assist')pcs.push([`When ${he} walks, the gait is steady and normal.`,`عندما ${ar('يمشي','تمشي')} تكون مشيته${ar('','ا')} ثابتة وطبيعية.`]);
    R6.push(mode==='bed'?['Bed rest scores 0 for gait.','الراحة بالفراش تعطي صفرًا لطريقة المشي.']:mode==='wc'?['Wheelchair scores 0 for gait.','الكرسي المتحرك يعطي صفرًا لطريقة المشي.']:GR[4][0]);
  }else if(a[4]===1){
    pcs.push([`Walking, ${he} takes short, weak steps but stays steady.`,`عند المشي ${ar('يخطو','تخطو')} خطوات قصيرة وضعيفة لكن ${ar('يبقى ثابتًا','تبقى ثابتة')}.`]);R6.push(GR[4][1]);
  }else{
    pcs.push([`${He} struggles to rise from the chair, pushes up with ${his} arms and is unsteady.`,`${ar('يجد','تجد')} صعوبة في النهوض من الكرسي و${ar('يدفع','تدفع')} نفسه${ar('','ا')} بذراعيه${ar('','ا')} ${ar('وهو','وهي')} غير ${ar('ثابت','ثابتة')}.`]);R6.push(GR[4][2]);
  }
  // 6 mental
  const ord=[`Nursing order: call for help to go to the bathroom. Asked "Can you go to the bathroom alone?", ${he}`,`أمر التمريض: طلب المساعدة للذهاب إلى الحمام. عند سؤال${ar('ه','ها')} «هل تستطيع${ar('','ين')} الذهاب إلى الحمام وحدك؟» `];
  if(a[5]===1){
    if(Math.random()<.5){pcs.push([`${He} is confused and tries to get up alone, forgetting ${his} weakness.`,`${ar('هو مرتبك و','هي مرتبكة و')}${ar('يحاول','تحاول')} النهوض وحده${ar('','ا')} ${ar('ناسيًا','ناسيةً')} ضعفه${ar('','ا')}.`]);props.push('bubbleQ');}
    else{pcs.push([`${ord[0]} answers "Yes, I can go alone."`,`${ord[1]}${ar('أجاب','أجابت')}: «نعم، أستطيع وحدي».`]);props.push('bubbleX');}
    R6.push(GR[5][1]);
  }else{pcs.push([`${ord[0]} answers "No, I need help." This matches the order.`,`${ord[1]}${ar('أجاب','أجابت')}: «لا، أحتاج إلى مساعدة». وهذا يتفق مع الأمر.`]);R6.push(GR[5][0]);}
  // convert internal aid scale (none, aid, furniture) to the 4 form options
  const aidIdx=[mode==='none'||mode===''?0:1,2,3][a[2]];
  a[2]=aidIdx;
  const n=++gid,title=m?`Mr. ${nm[0]}`:`Ms. ${nm[0]}`,titleAr=m?`السيد ${nm[1]}`:`السيدة ${nm[1]}`;
  const intro=[`${title}, ${age}, is admitted to the medical-surgical ward.`,`${titleAr}، ${age} سنة، ${ar('منوّم','منوّمة')} في قسم الباطنة والجراحة.`];
  const body=lv==='easy'?pcs:shuffle(pcs);
  const nt=traps.length?[traps.map(x=>x[0]).join(' '),traps.map(x=>x[1]).join(' ')]:['Score each item only from what the case states now.','قيّم كل بند فقط بحسب ما تذكره الحالة الآن.'];
  return {id:'g'+n,lv,gen:true,ti:[`Case ${n}: ${dxs[0][0]}`,`حالة ${n}: ${dxs[0][1]}`],
    st:[[intro[0]].concat(body.map(x=>x[0])).join(' '),[intro[1]].concat(body.map(x=>x[1])).join(' ')],
    a,nt,rat:R6,sc:{pose,props}};
}

/* ---------- state ---------- */
const S={lang:'en',view:'start',name:'',hid:'',unit:'',cur:null,draft:[],res:{},msg:''};
const L=()=>S.lang==='ar'?1:0;
const t=k=>TXT[k][L()];
const p=a=>a[L()];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const riskIdx=n=>n>=51?2:n>=25?1:0;
const num=n=>S.lang==='ar'?String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(n);
const $=id=>document.getElementById(id);
const scoreOf=a=>a.reduce((s,v,i)=>s+ITEMS[i].p[v],0);
const same=(i,x,y)=>ITEMS[i].p[x]===ITEMS[i].p[y];
const doneCount=()=>Object.keys(S.res).length;
const canReport=()=>doneCount()>=3;
function submitCur(){
  const sc=SC.find(x=>x.id===S.cur),ans=S.draft.slice();
  const ok=ans.filter((v,i)=>same(i,v,sc.a[i])).length,us=scoreOf(ans),ts=scoreOf(sc.a);
  S.res[sc.id]={ans,ok,us,ts,riskOk:riskIdx(us)===riskIdx(ts)};
}
function stats(){
  const rows=SC.filter(s=>S.res[s.id]),tot=rows.length*6,ok=rows.reduce((a,s)=>a+S.res[s.id].ok,0);
  const pct=tot?Math.round(ok/tot*100):0;
  return {rows,tot,ok,pct,pass:rows.length>=3&&pct>=80};
}
const fmtDate=()=>new Date().toLocaleDateString(S.lang==='ar'?'ar-SA-u-nu-latn':'en-GB',{year:'numeric',month:'long',day:'numeric'});
function ratHtml(sc,r){
  const rows=ITEMS.map((it,i)=>{const j=sc.a[i],why=sc.rat?sc.rat[i]:GR[i][j],good=same(i,r.ans[i],j);
    return `<div class="rat"><div><span class="badge ${good?'ok':'no'}">${good?'✓':'✗'}</span> <b>${num(i+1)}. ${esc(p(it.q))}: ${esc(p(it.o[j]))}</b> <span class="pt2">+${num(it.p[j])}</span></div><div class="muted">${esc(p(why))}</div></div>`;}).join('');
  const sum=sc.a.map((j,i)=>num(ITEMS[i].p[j])).join(' + ');
  return `<h3 style="margin-block-start:16px">${esc(t('rat'))}</h3>${rows}<div class="note" style="margin-block-start:10px"><b><bdi dir="ltr">${sum} = ${num(r.ts)}</bdi></b> → ${esc(p(RISK[riskIdx(r.ts)].n))}</div>`;
}

/* ---------- views ---------- */
function topBar(){
  return `<header class="top"><div class="brand"><div class="mark">MFS</div><div><h1>${esc(t('title'))}</h1><small>${esc(t('sub'))}</small></div></div>
  <div class="row">${IS_OWNER?`<button class="btn ghost" data-act="admin">${esc(t('admin'))}</button>`:''}<div class="lang" role="group" aria-label="${esc(t('lang'))}"><button data-act="lang" data-v="en" aria-pressed="${S.lang==='en'}">English</button><button data-act="lang" data-v="ar" aria-pressed="${S.lang==='ar'}">العربية</button></div></div></header>`;
}
const foot=()=>`<footer class="foot">${esc(t('by'))}<br>${esc(t('disc'))}${SHEET_URL&&!IS_OWNER?`<br><button class="linkbtn" data-act="admin">${esc(t('sup'))}</button>`:''}</footer>`;
const who=()=>`<div class="who"><span>${esc(S.name)}</span><span>ID ${esc(S.hid)}</span><span>${esc(S.unit)}</span></div>`;
const legend=()=>`<div class="legend"><div>${RISK.map(r=>`<div>${r.r[0]===51?'≥51':r.r[0]+' - '+r.r[1]}: ${esc(p(r.n))}</div>`).join('')}</div><div class="muted">${esc(t('formNote'))}</div></div>`;

function vStart(){
  const ready=S.name.trim()&&S.hid.trim()&&S.unit.trim();
  return `<section class="panel intro"><h2>${esc(t('iTitle'))}</h2><p>${esc(t('iP'))}</p>
  <div class="grid2"><div><h3>${esc(t('iGain'))}</h3><ul class="act">${INTRO.gain.map(x=>`<li>${esc(p(x))}</li>`).join('')}</ul></div>
  <div><h3>${esc(t('iHow'))}</h3><ol class="act">${INTRO.how.map(x=>`<li>${esc(p(x))}</li>`).join('')}</ol></div></div>
  <div class="note" style="margin-block-start:14px">${esc(t('iCal'))}</div></section>
  <section class="panel"><p class="muted" style="margin:0 0 14px">${esc(t('need'))}</p>
  <div class="grid3" style="margin-block-end:18px">
   <div><label class="f" for="in-name">${esc(t('name'))}</label><input id="in-name" type="text" autocomplete="off" value="${esc(S.name)}"></div>
   <div><label class="f" for="in-hid">${esc(t('hid'))}</label><input id="in-hid" type="text" inputmode="numeric" dir="ltr" autocomplete="off" value="${esc(S.hid)}"></div>
   <div><label class="f" for="in-unit">${esc(t('unit'))}</label><input id="in-unit" type="text" autocomplete="off" placeholder="${esc(t('unitPh'))}" value="${esc(S.unit)}"></div>
  </div>
  <button class="btn" id="go" data-act="go" ${ready?'':'disabled'}>${esc(t('start'))}</button></section>
  <section class="panel"><h3>${esc(t('guide'))}</h3>${legend()}</section>`;
}
function vHub(){
  const n=doneCount(),ok=canReport();
  return `<section class="panel"><div class="row" style="justify-content:space-between">${who()}</div>
  <div class="bar" aria-hidden="true"><i style="width:${Math.min(100,n/3*100)}%"></i></div>
  <p style="margin:0 0 4px"><b>${num(n)}</b> ${esc(t('prog'))}</p>
  ${ok?'':`<p class="muted" style="margin:0 0 6px">${esc(t('reqLv'))}</p>`}
  <div class="row" style="margin-block-start:10px"><button class="btn" data-act="gen">+ ${esc(t('newCase'))}</button><button class="btn ghost" data-act="report" ${ok?'':'disabled'}>${esc(t('finish'))}</button></div></section>
  <div class="grid2">${SC.map((s,i)=>{const r=S.res[s.id];
   return `<button class="card" data-act="open" data-v="${s.id}">${scene(s.sc,p(s.ti))}<div class="meta"><b>${num(i+1)}. ${esc(p(s.ti))}</b>
   ${r?`<span class="tag ${r.ok===6?'ok':r.ok>=4?'mid':'no'}">${num(r.ok)}/6 ${esc(t('items'))}</span>`:`<span class="tag todo">${esc(t('todo'))}</span>`}</div></button>`}).join('')}</div>`;
}
function vPlay(){
  const sc=SC.find(x=>x.id===S.cur),r=S.res[sc.id],lock=!!r,idx=SC.indexOf(sc);
  let h=`<section class="panel"><button class="btn ghost" data-act="hub" style="margin-block-end:14px">${esc(t('back'))}</button>
  <div class="hero">${scene(sc.sc,p(sc.ti))}</div>
  <p class="muted" style="margin:14px 0 2px;font-size:13.5px">${esc(t('scen'))} ${num(idx+1)}</p>
  <h2>${esc(p(sc.ti))}</h2><p style="margin:0">${esc(p(sc.st))}</p></section>
  <section class="panel form ${lock?'locked':''}">`;
  ITEMS.forEach((it,i)=>{
    const order=it.disp||it.o.map((_,k)=>k);
    h+=`<div class="frow"><div class="flabel"><span class="req">*</span>${esc(p(it.q))}<details class="gl"><summary>${esc(t('guideline'))}</summary><p>${esc(p(it.g))}</p></details></div><div class="fopts">`;
    order.forEach(j=>{
      let cls='chk';
      if(lock){const mine=r.ans[i]===j;if(j===sc.a[i]||(mine&&same(i,j,sc.a[i])))cls+=' right';else if(mine)cls+=' wrong';}
      h+=`<label class="${cls}"><input type="radio" name="q${i}" value="${j}" data-q="${i}" ${lock?'disabled':''} ${(lock?r.ans[i]:S.draft[i])===j?'checked':''}><span>${esc(p(it.o[j]))}${lock?` <small class="pt2">(${num(it.p[j])})</small>`:''}</span></label>`;
    });
    h+=`</div></div>`;
  });
  h+=legend();
  if(!lock){h+=`<div class="row" style="margin-block-start:16px"><button class="btn" id="sub" data-act="submit" disabled>${esc(t('submit'))}</button><span class="muted" id="subhint" style="font-size:14px">${esc(t('answerAll'))}</span></div>`;}
  h+=`</section>`;
  if(lock){
    const rk=RISK[riskIdx(r.ts)],uk=RISK[riskIdx(r.us)];
    h+=`<section class="panel" id="fbk"><div class="grid2"><div class="result risk-${riskIdx(r.us)}"><small>${esc(t('yourTotal'))}</small><div class="big">${num(r.us)} / 125</div><b>${esc(p(uk.n))}</b></div>
    <div class="result risk-${riskIdx(r.ts)}"><small>${esc(t('trueTotal'))}</small><div class="big">${num(r.ts)} / 125</div><b>${esc(p(rk.n))}</b></div></div>
    <p><b>${num(r.ok)}/6</b> ${esc(t('items'))}</p><div class="note">${esc(p(sc.nt))}</div>${ratHtml(sc,r)}
    <h3 style="margin-block-start:16px">${esc(t('acts'))} (${esc(p(rk.n))})</h3><ul class="act">${ACT[riskIdx(r.ts)].map(a=>`<li>${esc(p(a))}</li>`).join('')}</ul>
    <div class="row" style="margin-block-start:18px"><button class="btn" data-act="gen">+ ${esc(t('newAnother'))}</button><button class="btn ghost" data-act="hub">${esc(t('back2'))}</button>${canReport()?`<button class="btn ghost" data-act="report">${esc(t('finish'))}</button>`:`<span class="muted">${num(doneCount())}/3</span>`}</div></section>`;
  }
  return h;
}
function vReport(){
  const st=stats(),rows=st.rows;
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(t('report'))}</h2><button class="btn ghost" data-act="hub">${esc(t('back2'))}</button></div>
  <div class="row" style="margin-block-start:12px"><button class="btn" id="xls" data-act="xlsx">${esc(t('xlsBtn'))}</button><button class="btn ghost" id="pdf" data-act="pdf">${esc(t('pdfBtn'))}</button></div>
  ${st.pass?'':`<p class="note" style="margin:12px 0 0">${esc(t('moreTxt'))}</p>`}
  <p id="msg" class="muted" role="status" style="margin:10px 0 0">${esc(S.msg)}</p><p id="rec" class="muted" style="margin:6px 0 0">${esc(recMsg())}</p></section>
  <div class="paper-wrap"><div class="paper" id="paper" dir="${S.lang==='ar'?'rtl':'ltr'}">
   <div class="hd"><div><h2>${esc(t('title'))}</h2><small>${esc(t('report'))} · ${esc(t('sub'))}</small></div><div class="num" style="font-weight:600;color:#0e6a65">MFS</div></div>
   <dl><dt>${esc(t('name'))}</dt><dd>${esc(S.name)}</dd><dt>${esc(t('hid'))}</dt><dd class="num" dir="ltr" style="text-align:start">${esc(S.hid)}</dd><dt>${esc(t('unit'))}</dt><dd>${esc(S.unit)}</dd><dt>${esc(t('date'))}</dt><dd>${esc(fmtDate())}</dd></dl>
   <div class="verdict ${st.pass?'':'fail'}"><div><small class="small">${esc(t('overall'))}</small><br><b class="num">${num(st.ok)}/${num(st.tot)} · ${num(st.pct)}%</b></div><b style="color:${st.pass?'#1d7a4b':'#b3261e'}">${esc(st.pass?t('comp'):t('rev'))}</b></div>
   <table><thead><tr><th>#</th><th>${esc(t('scen'))}</th><th>${esc(t('items'))}</th><th>${esc(t('yS'))}</th><th>${esc(t('cS'))}</th><th>${esc(t('match'))}</th></tr></thead><tbody>
   ${rows.map((s,i)=>{const r=S.res[s.id];return `<tr><td class="num">${num(i+1)}</td><td>${esc(p(s.ti))}</td><td class="num">${num(r.ok)}/6</td><td class="num">${num(r.us)}</td><td class="num">${num(r.ts)}</td><td>${esc(p(RISK[riskIdx(r.ts)].n))} ${r.riskOk?'✓':'✗'}</td></tr>`}).join('')}</tbody></table>
   <p class="small">${esc(t('guide'))} ${esc(t('passTxt'))}</p>
   <div class="sig"><span>${esc(t('sign'))}: ____________________</span><span>${esc(t('by'))}</span></div>
  </div></div>`;
}

/* ---------- supervisor records (owner only can read) ---------- */
let DB=null,USER=null,IS_OWNER=false,MYID=null;
(async()=>{
  try{USER=await window.claude?.use?.('user');}catch(e){}
  try{DB=await window.claude?.use?.('db');}catch(e){}
  try{if(USER){IS_OWNER=await USER.isOwner();MYID=await USER.id();}}catch(e){}
  if(IS_OWNER)render();
})();
const recMsg=()=>S.rec==='unc'?t('recUnc'):S.rec==='ok'?t('recOk'):S.rec==='no'?t('recNo'):S.rec==='pending'?t('recWait'):'';
function showRec(){const e=$('rec');if(e)e.textContent=recMsg();}
async function postSheet(att){
  const body=JSON.stringify({name:S.name,hid:S.hid,unit:S.unit,cases:att.cases,ok:att.ok,total:att.total,pct:att.pct,pass:att.pass,list:att.list});
  try{
    const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'rejected');
    return 'ok';
  }catch(e){
    if(e instanceof TypeError)return 'unc'; // sent, but the browser could not read the reply
    throw e;
  }
}
async function recordResult(){
  if(S.recN===doneCount()&&(S.rec==='ok'||S.rec==='unc')){showRec();return;}
  S.rec='pending';showRec();
  const st=stats(),at=new Date().toISOString();
  const att={at,cases:st.rows.length,ok:st.ok,total:st.tot,pct:st.pct,pass:st.pass,
    list:st.rows.slice(0,25).map(s=>({t:String(s.ti[0]).slice(0,60),us:S.res[s.id].us,ts:S.res[s.id].ts,ok:S.res[s.id].ok}))};
  let res='no';
  if(DB&&MYID){
    try{
      const ref=DB.doc('results/'+MYID),snap=await ref.get();
      const old=snap.exists&&Array.isArray(snap.data().attempts)?snap.data().attempts:[];
      await ref.set({name:S.name,hid:S.hid,unit:S.unit,updated:at,cases:att.cases,ok:att.ok,total:att.total,pct:att.pct,pass:att.pass,attempts:old.concat([att]).slice(-30)});
      res='ok';
    }catch(e){}
  }
  if(SHEET_URL){
    try{const r=await postSheet(att);if(res!=='ok')res=r;}catch(e){}
  }
  S.rec=res;if(res!=='no')S.recN=doneCount();
  showRec();
}
function groupRows(rows){
  const m={};
  rows.forEach(r=>{
    const a={at:r.at,cases:r.cases,ok:r.ok,total:r.total,pct:r.pct,pass:r.pass,list:r.list||[]};
    const g=m[r.hid]=m[r.hid]||{id:r.hid,attempts:[]};
    g.attempts.push(a);Object.assign(g,{name:r.name,hid:r.hid,unit:r.unit,updated:r.at,cases:r.cases,ok:r.ok,total:r.total,pct:r.pct,pass:r.pass});
  });
  return Object.values(m).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
}
async function loadAdmin(){
  const useDb=!!(IS_OWNER&&DB);
  if(!useDb&&SHEET_URL&&!S.admKey){S.adm={state:'key',rows:[]};render();return;}
  S.adm={state:'loading',rows:[]};render();
  try{
    if(useDb){
      const q=await DB.collection('results').get();
      S.adm={state:'ok',rows:q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)))};
    }else{
      if(!SHEET_URL)throw new Error('nosource');
      const r=await fetch(SHEET_URL+'?key='+encodeURIComponent(S.admKey)),j=await r.json();
      if(!j.ok)throw new Error(j.error||'unauthorized');
      S.adm={state:'ok',rows:groupRows(j.rows)};
    }
  }catch(e){S.adm={state:'err',rows:[]};if(!useDb)S.admKey='';}
  if(S.view==='admin')render();
}
const fmtAt=iso=>{try{return new Date(iso).toLocaleString(S.lang==='ar'?'ar-SA-u-nu-latn':'en-GB',{dateStyle:'medium',timeStyle:'short'});}catch(e){return iso||'';}};
function admList(){
  const q=(S.admQ||'').trim().toLowerCase(),rows=(S.adm?S.adm.rows:[]).filter(r=>!q||[r.name,r.hid,r.unit].join(' ').toLowerCase().includes(q));
  if(!rows.length)return `<p class="muted">${esc(t('noRows'))}</p>`;
  return `<div class="paper-wrap"><table class="tbl"><thead><tr><th>${esc(t('name'))}</th><th>${esc(t('hid'))}</th><th>${esc(t('unit'))}</th><th>${esc(t('last'))}</th><th>${esc(t('cases'))}</th><th>${esc(t('overall'))}</th><th>${esc(t('result'))}</th><th>${esc(t('attempts'))}</th></tr></thead><tbody>`+
  rows.map(r=>`<tr><td>${esc(r.name||'')}</td><td dir="ltr" style="text-align:start">${esc(r.hid||'')}</td><td>${esc(r.unit||'')}</td><td>${esc(fmtAt(r.updated))}</td><td>${num(r.cases||0)}</td><td><b>${num(r.pct||0)}%</b> <small class="muted">(${num(r.ok||0)}/${num(r.total||0)})</small></td><td><span class="tag ${r.pass?'ok':'no'}">${esc(r.pass?t('comp'):t('rev'))}</span></td>
   <td><details class="gl"><summary>${num((r.attempts||[]).length)}</summary>${(r.attempts||[]).slice().reverse().map(a=>`<p><b>${esc(fmtAt(a.at))}</b>: ${num(a.pct)}% · ${num(a.cases)} ${esc(t('scen'))}<br><small class="muted">${(a.list||[]).map(x=>esc(x.t)+' ('+num(x.us)+'/'+num(x.ts)+')').join(' · ')}</small></p>`).join('')}</details></td></tr>`).join('')+`</tbody></table></div>`;
}
function vAdmin(){
  const A=S.adm||{state:'loading',rows:[]};
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(t('admTitle'))}</h2><button class="btn ghost" data-act="${S.name?'hub':'home'}">${esc(t('back2'))}</button></div>
  <div class="row" style="margin-block:12px"><input id="adm-q" type="text" style="max-width:320px" placeholder="${esc(t('search'))}" value="${esc(S.admQ||'')}"><button class="btn ghost" data-act="refresh">${esc(t('refresh'))}</button><button class="btn" id="axl" data-act="axl" ${A.rows.length?'':'disabled'}>${esc(t('exportAll'))}</button></div>
  <p id="msg" class="muted" role="status" style="margin:0 0 8px">${esc(S.msg)}</p>
  ${(A.state==='key'||A.state==='err')&&!(IS_OWNER&&DB)?`<div class="row" style="margin-block-end:10px"><input id="adm-key" type="password" autocomplete="off" style="max-width:260px" placeholder="${esc(t('adminKey'))}"><button class="btn" data-act="admkey">${esc(t('openBtn'))}</button></div>`:''}
  <div id="adm-list">${A.state==='loading'?`<p class="muted">${esc(t('loading'))}</p>`:A.state==='err'?`<p class="muted">${esc(t('admErr'))}</p>`:A.state==='key'?'':admList()}</div></section>`;
}
async function saveAdmin(){
  const btn=$('axl'),msg=$('msg'),say=m=>{S.msg=m;if(msg)msg.textContent=m;};
  btn.disabled=true;say(t('prep'));
  try{
    const dl=await getSaver();
    const X=window.XLSX,wb=X.utils.book_new(),rows=S.adm.rows;
    const a1=[[t('name'),t('hid'),t('unit'),t('last'),t('cases'),t('overall'),t('result'),t('attempts')]].concat(rows.map(r=>[r.name,r.hid,r.unit,fmtAt(r.updated),r.cases,r.pct+'%',r.pass?'PASS':'NOT YET PASSED',(r.attempts||[]).length]));
    const w1=X.utils.aoa_to_sheet(a1);w1['!cols']=[{wch:28},{wch:14},{wch:26},{wch:22},{wch:12},{wch:12},{wch:18},{wch:10}];
    const a2=[[t('name'),t('hid'),t('unit'),t('date'),t('cases'),t('overall'),t('result'),t('scen')]];
    rows.forEach(r=>(r.attempts||[]).forEach(a=>a2.push([r.name,r.hid,r.unit,fmtAt(a.at),a.cases,a.pct+'%',a.pass?'PASS':'NOT YET PASSED',(a.list||[]).map(x=>x.t+' ('+x.us+'/'+x.ts+')').join(' | ')])));
    const w2=X.utils.aoa_to_sheet(a2);w2['!cols']=[{wch:28},{wch:14},{wch:26},{wch:22},{wch:12},{wch:12},{wch:18},{wch:80}];
    X.utils.book_append_sheet(wb,w1,t('staff'));X.utils.book_append_sheet(wb,w2,t('attempts'));
    if(S.lang==='ar')wb.Workbook={Views:[{RTL:true}]};
    await dl.save({filename:'MorseFall_All_Staff_Results.xlsx',data:X.write(wb,{bookType:'xlsx',type:'array'})});
    say(t('saved'));
  }catch(err){say(err&&err.code==='declined'?t('declined'):t('err'));}
  const b=$('axl');if(b)b.disabled=false;
}

/* ---------- render + events ---------- */
function render(){
  $('app').dir=S.lang==='ar'?'rtl':'ltr';
  document.documentElement.lang=S.lang;
  const v=S.view==='start'?vStart():S.view==='hub'?vHub():S.view==='play'?vPlay():S.view==='admin'?vAdmin():vReport();
  $('root').innerHTML=topBar()+v+foot();
  if(S.view==='play'&&!S.res[S.cur])syncSubmit();
}
function syncSubmit(){
  const b=$('sub');if(!b)return;
  const full=ITEMS.every((_,i)=>S.draft[i]!==undefined);
  b.disabled=!full;const h=$('subhint');if(h)h.hidden=full;
}
function go(v){S.view=v;S.msg='';render();window.scrollTo(0,0);}
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='adm-q'){S.admQ=e.target.value;const l=$('adm-list');if(l)l.innerHTML=admList();return;}
  if(id==='in-name')S.name=e.target.value;else if(id==='in-hid')S.hid=e.target.value;else if(id==='in-unit')S.unit=e.target.value;else return;
  const b=$('go');if(b)b.disabled=!(S.name.trim()&&S.hid.trim()&&S.unit.trim());
});
document.addEventListener('change',e=>{
  if(e.target.matches('input[type=radio][data-q]')){S.draft[+e.target.dataset.q]=+e.target.value;syncSubmit();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='lang'){S.lang=v;render();}
  else if(a==='go'){if(S.name.trim()&&S.hid.trim()&&S.unit.trim())go('hub');}
  else if(a==='hub')go('hub');
  else if(a==='home')go('start');
  else if(a==='open'){S.cur=v;S.draft=S.res[v]?S.res[v].ans.slice():[];go('play');}
  else if(a==='gen'){const c=genCase();SC.push(c);S.cur=c.id;S.draft=[];go('play');}
  else if(a==='submit'){if(ITEMS.every((_,i)=>S.draft[i]!==undefined)){submitCur();render();const f=$('fbk');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});}}
  else if(a==='report'){if(canReport()){go('report');recordResult();}}
  else if(a==='admin'){S.view='admin';loadAdmin();}
  else if(a==='refresh')loadAdmin();
  else if(a==='admkey'){const k=$('adm-key');S.admKey=k?k.value.trim():'';if(S.admKey)loadAdmin();}
  else if(a==='axl')saveAdmin();
  else if(a==='xlsx')saveFile('xlsx');
  else if(a==='pdf')saveFile('pdf');
});

/* ---------- Excel + PDF ---------- */
function buildXlsx(){
  const st=stats(),X=window.XLSX,wb=X.utils.book_new(),ar=S.lang==='ar';
  const sum=[[t('title')],[t('by')],[],
   [t('name'),S.name],[t('hid'),S.hid],[t('unit'),S.unit],[t('date'),fmtDate()],[],
   [t('cases'),st.rows.length],[t('items'),st.ok+' / '+st.tot],[t('overall'),st.pct+'%'],[t('passTxt')],[t('result'),st.pass?'PASS - '+t('comp'):'NOT YET PASSED - '+t('rev')]];
  const w1=X.utils.aoa_to_sheet(sum);w1['!cols']=[{wch:28},{wch:46}];
  const h2=['#',t('scen'),t('items'),t('yS'),t('cS'),t('match')+' ('+t('yS')+')',t('match')+' ('+t('cS')+')','Risk match'];
  const r2=st.rows.map((s,i)=>{const r=S.res[s.id];return [i+1,p(s.ti),r.ok+'/6',r.us,r.ts,p(RISK[riskIdx(r.us)].n),p(RISK[riskIdx(r.ts)].n),r.riskOk?'✓':'✗'];});
  const w2=X.utils.aoa_to_sheet([h2].concat(r2));w2['!cols']=[{wch:5},{wch:38},{wch:12},{wch:12},{wch:16},{wch:22},{wch:22},{wch:12}];
  const h3=['#',t('scen'),t('item'),t('yourAns'),t('corrAns'),t('pts'),t('ok')];
  const r3=[];st.rows.forEach((s,i)=>{const r=S.res[s.id];ITEMS.forEach((it,k)=>{r3.push([i+1,p(s.ti),p(it.q),p(it.o[r.ans[k]]),p(it.o[s.a[k]]),it.p[r.ans[k]],same(k,r.ans[k],s.a[k])?'✓':'✗']);});});
  const w3=X.utils.aoa_to_sheet([h3].concat(r3));w3['!cols']=[{wch:5},{wch:36},{wch:34},{wch:30},{wch:30},{wch:9},{wch:9}];
  X.utils.book_append_sheet(wb,w1,t('sSum'));X.utils.book_append_sheet(wb,w2,t('sSc'));X.utils.book_append_sheet(wb,w3,t('sAn'));
  if(ar)wb.Workbook={Views:[{RTL:true}]};
  return X.write(wb,{bookType:'xlsx',type:'array'});
}
async function buildPdf(){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const src=$('paper'),clone=src.cloneNode(true);
  clone.removeAttribute('id');clone.style.cssText='position:fixed;left:-10000px;top:0;width:794px;max-width:794px';
  document.body.appendChild(clone);
  const canvas=await html2canvas(clone,{scale:2,backgroundColor:'#ffffff'});
  clone.remove();
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'p'});
  const W=210,H=297,perPage=Math.floor(canvas.width*H/W);let y=0,pg=0;
  while(y<canvas.height){
    const h=Math.min(perPage,canvas.height-y),c=document.createElement('canvas');
    c.width=canvas.width;c.height=h;c.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
    if(pg)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,h*W/canvas.width);y+=h;pg++;
  }
  return pdf.output('arraybuffer');
}
async function getSaver(){
  const dl=await window.claude?.use?.('downloads');
  if(dl)return dl;
  return {save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return {status:'saved'};}};
}
async function saveFile(kind){
  const btn=$(kind==='xlsx'?'xls':'pdf'),msg=$('msg');
  const say=m=>{S.msg=m;if(msg)msg.textContent=m;};
  btn.disabled=true;say(t('prep'));
  try{
    const dl=await getSaver();
    const safe=String(S.hid).replace(/[^\w-]+/g,'')||'staff';
    const data=kind==='xlsx'?buildXlsx():await buildPdf();
    await dl.save({filename:`MorseFall_Results_${safe}.${kind}`,data});
    say(t('saved'));
  }catch(err){
    say(err&&err.code==='declined'?t('declined'):(err&&err.code==='unavailable'?t('noDl'):t('err')));
  }
  btn.disabled=false;
}
render();
