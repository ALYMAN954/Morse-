  --sv-wall:#e6eef0; --sv-floor:#c9d6da; --sv-win:#cfe6f3; --sv-line:#7f949c; --sv-skin:#e0b48c; --sv-gown:#7fb3c8; --sv-leg:#6f8f9c;

}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(16px*var(--fs,1));line-height:1.55;

.wrap{max-width:880px;margin-inline:auto}

.muted{color:var(--muted)}

svg.sv{display:block;width:100%;height:auto}

.item{border-top:1px solid var(--line);padding-block:16px}

.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-block-end:8px;cursor:pointer;background:var(--surface)}

.risk-0{background:var(--good-soft)} .risk-1{background:var(--warn-soft)} .risk-2{background:var(--bad-soft)}

ul.act{margin:8px 0 0;padding-inline-start:20px}

.form{padding-block:10px 20px}
.frow{display:grid;grid-template-columns:minmax(160px,1fr) 2.2fr;gap:8px 18px;padding-block:13px;border-top:1px solid var(--line);align-items:start}

.chk input:checked{background:var(--accent);border-color:var(--accent)}

.locked .chk,.locked .chk input{cursor:default}
.chk.right{background:var(--good-soft);color:var(--good);font-weight:600}
.chk.wrong{background:var(--bad-soft);color:var(--bad)}
details.gl{margin-block-start:4px;font-weight:400}

.legend{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;border-top:1px solid var(--line);margin-block-start:8px;padding-block-start:14px;font-size:14px}
ol.act{margin:8px 0 0;padding-inline-start:22px}

.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:start;vertical-align:top}.tbl th{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.setb{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:19px;cursor:pointer;line-height:1}
.setp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-block-end:14px;display:grid;gap:12px}
.setp h3{margin:0 0 6px;font-size:15px}.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:14.5px}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sw{width:34px;height:34px;border-radius:50%!important;padding:0!important;border:3px solid var(--surface)!important;box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-block:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}.kpi small{color:var(--muted);display:block;font-size:12.5px}.kpi b{font-size:24px}
.ib{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr 52px;gap:10px;align-items:center;margin-block:7px;font-size:14px}
.ib .tr{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.ib i{display:block;height:100%;background:var(--accent)}.ib i.w{background:var(--bad)}.ib i.m{background:var(--warn)}
@media(max-width:560px){.ib{grid-template-columns:1fr 52px}.ib .tr{grid-column:1/3;order:3}}

.tmr{font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent-soft);border-radius:99px;padding:3px 12px;white-space:nowrap}
.tmr.low{background:var(--bad-soft);color:var(--bad)}
.cheer{background:var(--good-soft);color:var(--good);border-radius:10px;padding:11px 14px;font-weight:600;margin-block-end:12px}
.errc{border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:10px;padding:9px 12px;margin-block:8px;font-size:14.5px}
.errc .bad{color:var(--bad);font-weight:600}.errc .goodt{color:var(--good);font-weight:600}
select{font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:180px}
details.faq{border-top:1px solid var(--line);padding-block:8px}details.faq summary{font-weight:600;cursor:pointer}
.cert{width:1123px;height:794px;background:#fff;padding:26px;font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;color:#14262d}
.cert-in{height:100%;border:6px double #b38a3e;border-radius:6px;padding:26px 60px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center}
.cert-logo{width:300px;height:auto}.cert-org{color:#1fa9ad;font-weight:800;letter-spacing:.08em;font-size:19px;margin-top:6px}.cert-org2{color:#b38a3e;font-weight:800;letter-spacing:.16em;font-size:16px}
.cert h1{font-size:40px;margin:22px 0 8px;color:#0e6a65}.cert .c1{font-size:19px;margin:6px 0;color:#38505a}.cert .c2{font-size:20px;margin:12px 0;max-width:780px}
.cert .cname{font-size:44px;font-weight:700;margin:8px 0;color:#14262d;border-bottom:2px solid #b38a3e;padding:0 40px 4px}
.csig{display:flex;justify-content:space-between;gap:80px;width:100%;margin-top:auto;font-size:15px;color:#38505a}.csig>div{flex:1}.csig .ln{border-top:1.5px solid #38505a;margin-bottom:6px}
.cfoot{font-size:12px;color:#6b7f87;margin-top:14px}
details.svc{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}details.svc summary{cursor:pointer;font-size:16px}

<script>
"use strict";

let SHEET_URL='https://script.google.com/macros/s/AKfycbzjHLvA28eitIE7Oj9Q05q9gA94aY0QkoNBKAgki4YTX_F0kV6H_aI-WJDMKHDKPTYRsg/exec';

const VIDEO_FILE='intro.mp4';
const VIDEO_EMBED='';
/* ---------- data: hospital Morse Fall Scale form ---------- */
const ITEMS=[
{q:['History of falling; immediate or within 3 months','تاريخ السقوط؛ فوري أو خلال 3 أشهر'],
 g:['Scored 25 if the patient has fallen during the present hospital admission, or has an immediate history of physiological falls (for example seizures or an impaired gait) before admission. A patient who falls for the first time is immediately scored +25.','تُعطى 25 درجة إذا سقط المريض خلال الإقامة الحالية، أو كان لديه تاريخ سقوط فسيولوجي فوري (مثل التشنجات أو اضطراب المشي) قبل الدخول. وإذا سقط المريض لأول مرة تزيد درجته فورًا بمقدار 25.'],
 o:[['No','لا'],['Yes','نعم']],p:[0,25],disp:[1,0]},
{q:['Secondary diagnosis','تشخيص ثانوي'],
 g:['15 if more than one medical diagnosis is listed on the patient chart; if not, 0.','15 إذا كان هناك أكثر من تشخيص طبي مسجل في ملف المريض، وإلا 0.'],
 o:[['No','لا'],['Yes','نعم']],p:[0,15],disp:[1,0]},
{q:['Ambulatory aid','وسيلة المشي'],
 g:['0 if the patient walks without a walking aid (even if assisted by a nurse), uses a wheelchair, or is on bed rest and does not get out of bed at all. 15 if the patient uses crutches, a cane or a walker. 30 if the patient ambulates clutching onto furniture for support.','0 إذا كان المريض يمشي دون وسيلة مساعدة (حتى لو ساعدته الممرضة)، أو يستخدم كرسيًا متحركًا، أو على راحة بالفراش ولا يغادره إطلاقًا. 15 إذا استخدم عكازات أو عصا أو مشاية. 30 إذا كان يمشي متمسكًا بالأثاث للدعم.'],
 o:[['Unassisted','دون مساعدة'],['Bed rest / Nurse assist','راحة بالفراش / مساعدة التمريض'],['Crutches / Cane / Walker','عكازات / عصا / مشاية'],['Furniture','الأثاث']],p:[0,0,15,30]},
{q:['IV / Heparin lock','قسطرة وريدية / Heparin lock'],
 g:['20 if the patient has an intravenous apparatus or a heparin lock inserted; if not, 0.','20 إذا كان لدى المريض جهاز وريدي أو heparin lock مثبت، وإلا 0.'],
 o:[['No','لا'],['Yes','نعم']],p:[0,20],disp:[1,0]},
{q:['Gait / Transferring','طريقة المشي / الانتقال'],
 g:['Normal (0): head erect, arms swinging freely at the sides, striding without hesitation. Weak (10): stooped but able to lift the head while walking without losing balance; steps are short and the patient may shuffle. Impaired (20): difficulty rising from the chair, pushing on the arms or bouncing to rise; head down, watching the ground; poor balance, so the patient grasps furniture, a support person or a walking aid and cannot walk without this assistance.','طبيعية (0): رأس مرفوع، ذراعان تتحركان بحرية، خطوات دون تردد. ضعيفة (10): انحناء مع القدرة على رفع الرأس أثناء المشي دون فقد التوازن؛ خطوات قصيرة وقد يجرّ قدميه. مختلة (20): صعوبة في النهوض من الكرسي بالدفع على الذراعين أو بالارتداد؛ الرأس منخفض والنظر إلى الأرض؛ توازن ضعيف فيتمسك بالأثاث أو بشخص داعم أو بوسيلة مشي ولا يستطيع المشي بدونها.'],
 o:[['Normal / Bed rest / Immobile','طبيعية / راحة بالفراش / غير متحرك'],['Weak','ضعيفة'],['Impaired','مختلة']],p:[0,10,20]},
{q:['Mental status','الحالة الذهنية'],
 g:['Ask the patient: "Are you able to go to the bathroom alone or do you need assistance?" If the reply is consistent with the ambulatory order on the Kardex, the patient is rated normal: 0. If the reply is not consistent with the nursing orders or is unrealistic, the patient overestimates his or her ability and forgets limitations: 15.','اسأل المريض: «هل تستطيع الذهاب إلى الحمام وحدك أم تحتاج إلى مساعدة؟» إذا كان رده متفقًا مع أمر المشي في الكاردكس فهو طبيعي: 0. وإذا لم يتفق مع أوامر التمريض أو كان غير واقعي فهو يبالغ في تقدير قدرته وينسى محدوداته: 15.'],
 o:[['Oriented to own ability','مدرك لقدرته'],['Forgets limitations','ينسى محدوداته']],p:[0,15]}
];
const RISK=[
 {r:[0,24],n:['Low risk','خطر منخفض'],c:'ok'},
 {r:[25,50],n:['Moderate risk','خطر متوسط'],c:'mid'},
 {r:[51,125],n:['High risk','خطر مرتفع'],c:'no'}];
const ACT=[
 [['Basic safety: call light in reach, bed low, clear walkway.','سلامة أساسية: جرس النداء في المتناول، السرير منخفض، ممر خالٍ.'],['Orient the patient to the room and bathroom.','تعريف المريض بالغرفة والحمام.'],['Reassess on any change in condition.','إعادة التقييم عند أي تغير في الحالة.']],
 [['Standard fall precautions and non-slip footwear.','احتياطات السقوط القياسية وحذاء غير قابل للانزلاق.'],['Teach patient and family to call before getting up.','تثقيف المريض والأسرة بطلب المساعدة قبل النهوض.'],['Check IV lines and tubing before mobilizing.','فحص الخطوط الوريدية والأنابيب قبل التحريك.'],['Reassess every shift.','إعادة التقييم كل وردية.']],
 [['High-risk fall precautions: wristband and door sign per policy.','احتياطات السقوط العالية: سوار وإشارة على الباب حسب السياسة.'],['Bed alarm on, bed in lowest position.','تفعيل منبه السرير وأخفض وضع للسرير.'],['Scheduled toileting and hourly rounding.','جدول لدخول الحمام وجولات كل ساعة.'],['Stay with the patient during transfers and walking.','البقاء مع المريض أثناء الانتقال والمشي.'],['Review medications with the pharmacist; reassess daily.','مراجعة الأدوية مع الصيدلي؛ إعادة التقييم يوميًا.']]];

const SC=[
{id:'e1',lv:'easy',ti:['Day 1 after appendectomy','اليوم الأول بعد استئصال الزائدة'],
 st:['Mr. A, 45, is on day 1 after a laparoscopic appendectomy. The chart lists one diagnosis: acute appendicitis. He walks to the bathroom alone with a steady gait and no aid. His IV was removed this morning. He has never fallen. He is alert and follows instructions.','السيد أ، 45 سنة، في اليوم الأول بعد استئصال الزائدة بالمنظار. السجل يذكر تشخيصًا واحدًا: التهاب الزائدة الحاد. يمشي إلى الحمام وحده بخطوات ثابتة ودون وسيلة مساعدة. تم سحب القسطرة الوريدية هذا الصباح. لم يسقط من قبل. واعٍ ويتبع التعليمات.'],
 a:[0,0,0,0,0,0],nt:['When every item scores 0, the total is 0: low risk. Basic safety care is enough.','عندما تكون كل البنود صفرًا يكون المجموع صفرًا: خطر منخفض. تكفي إجراءات السلامة الأساسية.'],
 sc:{pose:'stand',props:['bed','nurse']}},
{id:'e2',lv:'easy',ti:['Heart failure with a walker','قصور القلب مع مشاية'],
 st:['Mrs. B, 78, is admitted with heart failure. The chart also lists hypertension and type 2 diabetes. Her daughter says she fell in the bathroom last week during a dizzy spell. She walks slowly with a walker, taking short weak steps. A saline lock is in her right forearm. She knows she needs help.','السيدة ب، 78 سنة، دخلت بسبب قصور القلب. السجل يذكر أيضًا ارتفاع ضغط الدم والسكري من النوع الثاني. تقول ابنتها إنها سقطت في الحمام الأسبوع الماضي أثناء نوبة دوخة. تمشي ببطء بمشاية بخطوات قصيرة وضعيفة. يوجد saline lock في الساعد الأيمن. وهي تدرك أنها تحتاج إلى مساعدة.'],
 a:[1,1,2,1,1,0],nt:['A walker scores 15. A saline lock counts as IV access even when no fluid is running.','المشاية تعطي 15 درجة. وsaline lock يُحسب كقسطرة وريدية حتى لو لم يكن هناك محلول جارٍ.'],
 sc:{pose:'stand',props:['walker','lock','fallbubble']}},
{id:'e3',lv:'easy',ti:['Pneumonia on bed rest','التهاب رئوي مع راحة بالفراش'],
 st:['Mr. C, 60, has pneumonia and COPD in his chart. He is on strict bed rest with IV fluids running. He has never fallen. He is oriented and understands that he must stay in bed.','السيد ج، 60 سنة، لديه التهاب رئوي وانسداد رئوي مزمن في السجل. هو على راحة تامة بالفراش مع محلول وريدي جارٍ. لم يسقط من قبل. مدرك ويفهم أنه يجب أن يبقى في السرير.'],
 a:[0,1,1,1,0,0],nt:['Bed rest scores 0 for both ambulatory aid and gait.','الراحة بالفراش تعطي صفرًا لوسيلة المشي ولطريقة المشي.'],
 sc:{pose:'lie',props:['iv']}},
{id:'e4',lv:'easy',ti:['Cellulitis with a saline lock','التهاب النسيج الخلوي مع saline lock'],
 st:['Ms. D, 55, is admitted for cellulitis of the leg. It is her only diagnosis. She has a saline lock for IV antibiotics. She has not fallen. She walks without aid, with a normal gait, and is oriented.','الآنسة د، 55 سنة، دخلت بسبب التهاب النسيج الخلوي في الساق وهو تشخيصها الوحيد. لديها saline lock لإعطاء المضاد الحيوي. لم تسقط. تمشي دون وسيلة مساعدة بمشية طبيعية وهي مدركة.'],
 a:[0,0,0,1,0,0],nt:['Only the IV access scores here: 20, low risk. Do not add points for the leg problem itself.','بند القسطرة الوريدية فقط يحصل على درجة: 20، خطر منخفض. لا تضف درجات لمشكلة الساق نفسها.'],
 sc:{pose:'stand',props:['lock','nurse']}},

{id:'m1',lv:'medium',ti:['Hip fracture repair, day 1','إصلاح كسر الورك، اليوم الأول'],
 st:['Mrs. E, 82, is on day 1 after hip fracture repair. The chart lists hip fracture, osteoporosis and hypertension. She fell at home two months ago because her legs gave way. Today she stands with a walker, pushes up with her arms, and is unsteady. A PCA pump runs through her IV. She asks for help every time.','السيدة هـ، 82 سنة، في اليوم الأول بعد إصلاح كسر الورك. السجل يذكر كسر الورك وهشاشة العظام وارتفاع الضغط. سقطت في المنزل قبل شهرين بسبب ضعف في ساقيها. اليوم تقف بمشاية، وتدفع نفسها بذراعيها، وهي غير ثابتة. مضخة PCA موصولة بالقسطرة الوريدية. وتطلب المساعدة في كل مرة.'],
 a:[1,1,2,1,2,0],nt:['A fall two months ago is inside the 3-month window. Struggling to rise and being unsteady is impaired gait: 20.','السقوط قبل شهرين ضمن فترة الثلاثة أشهر. صعوبة النهوض وعدم الثبات يعني مشية مختلة: 20 درجة.'],
 sc:{pose:'stand',props:['walker','iv','nurse','fallbubble']}},
{id:'m2',lv:'medium',ti:['Holding on to the furniture','التمسك بالأثاث'],
 st:['Mr. F, 68, has heart failure and diabetes. His last fall was eight months ago. He has no cane or walker. He moves by holding the bed rail, the bedside table and the wall. He rises slowly from the chair and is unsteady. IV furosemide is running. He says: "I am fine, I will go to the toilet myself", although the nursing order says to call for help.','السيد ف، 68 سنة، لديه قصور القلب والسكري. آخر سقوط له كان قبل ثمانية أشهر. ليس لديه عصا أو مشاية. يتنقل ممسكًا بحاجز السرير والطاولة الجانبية والحائط. ينهض ببطء من الكرسي وهو غير ثابت. يُعطى فوروسيمايد وريديًا. يقول: «أنا بخير، سأذهب إلى الحمام بنفسي» رغم أن أمر التمريض هو أن ينادي طلبًا للمساعدة.'],
 a:[0,1,3,1,2,1],nt:['Eight months ago is outside the window. Holding furniture is 30, the highest aid score. Refusing to call for help shows he forgets his limits.','ثمانية أشهر خارج الفترة. التمسك بالأثاث 30 درجة وهي أعلى درجة لوسيلة المشي. ورفضه طلب المساعدة يدل على أنه ينسى محدوداته.'],
 sc:{pose:'stand',props:['furn','iv','bubbleX']}},
{id:'m3',lv:'medium',ti:['Wheelchair after bariatric surgery','كرسي متحرك بعد جراحة السمنة'],
 st:['Ms. G, 50, is on day 2 after gastric sleeve surgery. Morbid obesity is the only active diagnosis in the chart. She moves by wheelchair and a nurse assists every transfer. IV fluids are running. She has never fallen and is oriented.','الآنسة غ، 50 سنة، في اليوم الثاني بعد عملية تكميم المعدة. السمنة المفرطة هي التشخيص الفعّال الوحيد في السجل. تتنقل بكرسي متحرك وتساعدها الممرضة في كل انتقال. المحلول الوريدي جارٍ. لم تسقط من قبل وهي مدركة.'],
 a:[0,0,1,1,0,0],nt:['A wheelchair with nurse assistance scores 0 for aid and 0 for gait. It is not "furniture".','الكرسي المتحرك مع مساعدة التمريض يعطي صفرًا لوسيلة المشي وصفرًا لطريقة المشي. وهو ليس «أثاثًا».'],
 sc:{pose:'wc',props:['iv','nurse']}},
{id:'m4',lv:'medium',ti:['Fall in the emergency room','سقوط في الطوارئ'],
 st:['Mr. H, 74, has pneumonia and COPD. He slipped on a wet floor in the ER last night on the way to the toilet. He now walks without aid with a steady gait. IV antibiotics are running. He is oriented and careful.','السيد ح، 74 سنة، لديه التهاب رئوي وانسداد رئوي مزمن. انزلق على أرضية مبللة في الطوارئ الليلة الماضية وهو في طريقه إلى الحمام. يمشي الآن دون وسيلة مساعدة بمشية ثابتة. المضاد الحيوي يُعطى وريديًا. هو مدرك وحذر.'],
 a:[1,1,0,1,0,0],nt:['A fall during the current episode of care counts as a history of falling: 25.','السقوط أثناء نفس فترة الرعاية الحالية يُحسب كتاريخ سقوط: 25 درجة.'],
 sc:{pose:'stand',props:['iv','wet','fallbubble']}},

{id:'h1',lv:'hard',ti:['Stroke with confusion','سكتة دماغية مع ارتباك'],
 st:['Mr. I, 88, has an ischemic stroke, atrial fibrillation and diabetes. He fell on the ward at 06:00 today. He has left-sided weakness, uses a cane in his right hand, drags his left foot and loses balance when turning. A heparin infusion runs through his IV. He is confused and keeps trying to leave the bed "to go to work".','السيد ع، 88 سنة، لديه سكتة دماغية إقفارية ورجفان أذيني وسكري. سقط في القسم الساعة 06:00 اليوم. لديه ضعف في الجانب الأيسر، ويستخدم عصا في يده اليمنى، ويجر قدمه اليسرى ويفقد توازنه عند الالتفاف. يُعطى هيبارين عبر القسطرة الوريدية. هو مرتبك ويحاول مرارًا مغادرة السرير «ليذهب إلى العمل».'],
 a:[1,1,2,1,2,1],nt:['Every positive answer applies: 110 of 125. Confusion about his limits is the key driver of this risk.','كل الإجابات الإيجابية تنطبق: 110 من 125. الارتباك بشأن محدوداته هو المحرك الرئيسي لهذا الخطر.'],

const pick=a=>a[Math.floor(Math.random()*a.length)];

const pickW=(v,w)=>{let x=Math.random(),i=0;for(;i<w.length-1;i++){if(x<w[i])break;x-=w[i];}return v[i];};

function genCase(cls,lvp){
  if(cls===undefined){const lv=pick(['easy','medium','hard']);for(let k=0;k<400;k++){const c=buildCase(lv);if(c)return c;}return buildCase('easy',true);}
  const lvs=[lvp||['easy','medium','hard'][cls],'easy','medium','hard'];
  for(let k=0;k<1500;k++){const c=buildCase(lvs[k<900?0:1+k%3]);if(c&&riskIdx(scoreOf(c.a))===cls)return c;}
  return buildCase('easy',true);
}

const fmtDur=sec=>{sec=Math.max(0,Math.round(sec||0));return num(Math.floor(sec/60))+':'+num(String(sec%60).padStart(2,'0'));};
function analysis(){
  const st=stats(),rows=st.rows,n=rows.length||1;
  const dom=ITEMS.map((it,i)=>{let ok=0,pu=0,pe=0;rows.forEach(s=>{const r=S.res[s.id];if(same(i,r.ans[i],s.a[i]))ok++;pu+=it.p[r.ans[i]];pe+=it.p[s.a[i]];});return {i,ok,n:rows.length,pct:Math.round(ok/n*100),pu,pe};});
  let under=0,over=0,agree=0,diff=0,secs=0;
  rows.forEach(s=>{const r=S.res[s.id],ru=riskIdx(r.us),rt=riskIdx(r.ts);if(ru<rt)under++;else if(ru>rt)over++;else agree++;diff+=r.us-r.ts;secs+=r.sec||0;});
  return Object.assign({},st,{dom,under,over,agree,avgDiff:Math.round(diff/n),secs});
}

  S.latin=true;try{return reportPagesInner();}finally{S.latin=false;}

  const weakDom=A.dom.filter(d=>d.pct<100).sort((a,b)=>a.pct-b.pct);

  // matrix pages
  const review=`<h4>${esc(t('rFocus'))}</h4>${weakDom.length?weakDom.map(d=>`<div class="tip"><b>${num(d.i+1)}. ${esc(p(ITEMS[d.i].q))}</b> <span class="num"><bdi dir="ltr">(${num(d.ok)}/${num(d.n)} · ${num(d.pct)}%)</bdi></span><br>${esc(p(TIP[d.i]))}</div>`).join(''):`<p>${esc(t('rNone'))}</p>`}

   <p style="font-size:11px;color:#5a6e77;margin-top:14px">${esc(t('guide'))} ${esc(t('disc'))}</p>`;
  const rowHtml=(s,idx)=>{const r=S.res[s.id],ru=riskIdx(r.us),rt=riskIdx(r.ts),m=ru===rt;
    return `<tr><td class="num">${num(idx+1)}</td><td class="l">${esc(p(s.ti))}</td>${ITEMS.map((_,i)=>{const g=same(i,r.ans[i],s.a[i]);return `<td class="${g?'yes':'nop'}">${g?'✓':'✗'}</td>`;}).join('')}<td class="num"><bdi dir="ltr">${num(r.us)} / ${num(r.ts)}</bdi></td><td><span class="chip ${m?'ok':(ru<rt?'no':'mid')}">${esc(p(RISK[ru].n))}</span>${m?'':`<br><small>${esc(t('rCorrectIs'))}: ${esc(p(RISK[rt].n))}</small>`}</td><td class="num"><bdi dir="ltr">${fmtDur(r.sec)}</bdi></td></tr>`;};
  const head=`<h4>${esc(t('rBreak'))}</h4>`;
  const legend=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;font-size:11px;color:#5a6e77;margin-top:8px">${ITEMS.map((it,i)=>`<div><b>${num(i+1)}</b> ${esc(p(it.q))}</div>`).join('')}</div>`;
  const per=9,chunks=[];for(let i=0;i<rows.length;i+=per)chunks.push(rows.slice(i,i+per));

    inners.push(head+tbl+legend+(last&&c.length<=6?review:''));
    if(last&&c.length>6)inners.push(review);
  });
  const n=inners.length;
  return inners.map((x,k)=>`<div class="pg" dir="${dir}"><div class="pg-in">${x}</div><div class="pg-ft"><span>${esc(t('by'))}</span><span>${esc(t('rPage'))} ${num(k+1)} / ${num(n)}</span></div></div>`).join('');
}

function showRec(){const e=$('rec');if(e)e.textContent=recMsg();}
async function postSheet(att,pdf){
  const body=JSON.stringify({pdf:pdf||'',pdfName:'MorseFall_'+String(S.hid).replace(/[^\w-]+/g,'')+'_'+att.at.slice(0,10)+'.pdf',lang:S.lang,at:att.at,name:S.name,hid:S.hid,unit:S.unit,cases:att.cases,ok:att.ok,total:att.total,pct:att.pct,pass:att.pass,list:att.list});
  try{
    const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'rejected');
    return 'ok';
  }catch(e){
    if(e instanceof TypeError)return 'unc'; // sent, but the browser could not read the reply
    throw e;
  }
}
async function recordResult(){
  if(S.recN===doneCount()&&(S.rec==='ok'||S.rec==='unc')){showRec();return;}
  S.rec='pending';showRec();
  const st=stats(),at=new Date().toISOString();
  const att={at,cases:st.rows.length,ok:st.ok,total:st.tot,pct:st.pct,pass:st.pass,
    list:st.rows.slice(0,24).map(s=>({t:String(s.ti[0]).slice(0,60),us:S.res[s.id].us,ts:S.res[s.id].ts,ok:S.res[s.id].ok})).concat([{dom:analysis().dom.map(d=>d.ok),mis:st.rows.reduce((o,sc)=>{const r=S.res[sc.id];ITEMS.forEach((_,i)=>{if(!same(i,r.ans[i],sc.a[i]))o.push(i+':'+r.ans[i]+'>'+sc.a[i]);});return o;},[]),n:st.rows.length,sid:S.sid||''}])};
  let res='no';
  if(DB&&MYID){
    try{
      const ref=DB.doc('results/'+MYID),snap=await ref.get();
      const old=snap.exists&&Array.isArray(snap.data().attempts)?snap.data().attempts:[];
      await ref.set({name:S.name,hid:S.hid,unit:S.unit,updated:at,cases:att.cases,ok:att.ok,total:att.total,pct:att.pct,pass:att.pass,attempts:old.concat([att]).slice(-30)});
      res='ok';
    }catch(e){}
  }
  if(SHEET_URL){
    let pdf='';
    try{pdf=b64(await buildPdf());}catch(e){}
    try{const r=await postSheet(att,pdf);if(res!=='ok')res=r;}catch(e){}
  }
  S.rec=res;if(res!=='no')S.recN=doneCount();
  showRec();
}
function groupRows(rows){
  const m={};
  rows.forEach(r=>{
    const a={at:r.at,cases:r.cases,ok:r.ok,total:r.total,pct:r.pct,pass:r.pass,list:r.list||[],pdf:r.pdf||''};
    const g=m[r.hid]=m[r.hid]||{id:r.hid,attempts:[]};
    g.attempts.push(a);Object.assign(g,{name:r.name,hid:r.hid,unit:r.unit,updated:r.at,cases:r.cases,ok:r.ok,total:r.total,pct:r.pct,pass:r.pass});
  });
  return Object.values(m).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
}
async function loadAdmin(){
  const useDb=!!(IS_OWNER&&DB);
  if(!useDb&&SHEET_URL&&!S.admKey){S.adm={state:'key',rows:[]};render();return;}
  S.adm={state:'loading',rows:[]};render();
  try{
    if(useDb){
      const q=await DB.collection('results').get();
      S.adm={state:'ok',rows:q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)))};
    }else{
      if(!SHEET_URL)throw new Error('nosource');
      const r=await fetch(SHEET_URL+'?key='+encodeURIComponent(S.admKey)),j=await r.json();
      if(!j.ok)throw new Error(j.error||'unauthorized');
      S.adm={state:'ok',rows:groupRows(j.rows)};ls.set(AK,S.admKey);
    }
  }catch(e){S.adm={state:'err',rows:[]};if(!useDb){S.admKey='';ls.del(AK);}}
  if(S.view==='admin')render();
}

const sidOf=a=>{const d=(a.list||[]).find(x=>x&&x.sid!==undefined);return d&&d.sid?d.sid:'at'+a.at;};
const sessN=l=>new Set(l.map(sidOf)).size;
function admAtts(){const o=[];(S.adm?S.adm.rows:[]).forEach(r=>(r.attempts||[]).forEach(a=>o.push(Object.assign({},a,{name:r.name,hid:r.hid,unit:r.unit}))));return o;}
function admSum(){
  const P=S.admP,now=new Date(),start=P===1?new Date(now.getFullYear(),now.getMonth(),now.getDate()):P?new Date(now.getTime()-P*864e5):new Date(0);
  const all=admAtts().sort((a,b)=>String(a.at).localeCompare(String(b.at))),at=all.filter(a=>new Date(a.at)>=start);
  const last={};at.forEach(a=>last[a.hid]=a);
  const staff=Object.values(last),passed=staff.filter(a=>a.pass),failed=staff.filter(a=>!a.pass);
  const dom=ITEMS.map(()=>({ok:0,n:0}));let withDom=0;
  at.forEach(a=>{const d=(a.list||[]).find(x=>x&&x.dom);if(d){withDom++;d.dom.forEach((o,i)=>{if(dom[i]){dom[i].ok+=o;dom[i].n+=d.n;}});}});
  const mis={};at.forEach(a=>{const d=(a.list||[]).find(x=>x&&x.dom);if(d&&Array.isArray(d.mis))d.mis.forEach(k=>mis[k]=(mis[k]||0)+1);});
  const topMis=Object.entries(mis).sort((x,y)=>y[1]-x[1]).slice(0,6).map(([k,n])=>{const [i,rest]=k.split(':'),[g,c]=rest.split('>');return {i:+i,g:+g,c:+c,n};});
  const by={};all.forEach(a=>(by[a.hid]=by[a.hid]||[]).push(a));
  const tries=[];Object.values(by).forEach(l=>{const ss=[];l.forEach(a=>{if(!ss.includes(sidOf(a)))ss.push(sidOf(a));});const k=ss.findIndex(id=>l.some(a=>sidOf(a)===id&&a.pass));if(k>=0)tries.push(k+1);});
  return {at,staff,passed,failed,topMis,dom:dom.map((d,i)=>({i,pct:d.n?Math.round(d.ok/d.n*100):null})),withDom,
    avgTry:tries.length?Math.round(tries.reduce((x,y)=>x+y,0)/tries.length*10)/10:null,
    avgPct:at.length?Math.round(at.reduce((x,a)=>x+(+a.pct||0),0)/at.length):0,
    rate:staff.length?Math.round(passed.length/staff.length*100):0};
}

  <div class="row" style="margin-block-start:14px"><button class="btn" data-act="wa">${esc(t('wa'))}</button><button class="btn ghost" data-act="cpy">${esc(t('cp'))}</button></div>`:`<p class="muted">${esc(t('noPeriod'))}</p>`}`;
}

  'Pass mark 100%, with a retake option',

  'Export all results to Excel',
  'Share the summary on WhatsApp or copy it',
  'PDF report of each result saved to Drive and emailed (Apps Script)']]
];
function servicesHtml(){
  return `<details class="gl svc" dir="ltr" lang="en" style="margin-block:6px 14px"><summary><b>App services</b></summary>${SERVICES.map(g=>`<h3 style="margin:12px 0 4px">${g[0]}</h3><ul class="act">${g[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</details>`;
}
function vAdmin(){
  const A=S.adm||{state:'loading',rows:[]};
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(t('admTitle'))}</h2><button class="btn ghost" data-act="${S.name?'hub':'home'}">${esc(t('back2'))}</button></div>
  <div class="row" style="margin-block:12px"><input id="adm-q" type="text" style="max-width:320px" placeholder="${esc(t('search'))}" value="${esc(S.admQ||'')}"><button class="btn ghost" data-act="refresh">${esc(t('refresh'))}</button><button class="btn" id="axl" data-act="axl" ${A.rows.length?'':'disabled'}>${esc(t('exportAll'))}</button></div>
  <p id="msg" class="muted" role="status" style="margin:0 0 8px">${esc(S.msg)}</p>
  ${servicesHtml()}
  ${A.state==='ok'?`<div style="margin-block:6px 18px"><h3 style="margin:0">${esc(t('sumT'))}</h3>${admSumHtml()}</div>`:''}
  ${(A.state==='key'||A.state==='err')&&!(IS_OWNER&&DB)?`<div class="row" style="margin-block-end:10px"><input id="adm-key" type="password" autocomplete="off" style="max-width:260px" placeholder="${esc(t('adminKey'))}"><button class="btn" data-act="admkey">${esc(t('openBtn'))}</button></div>`:''}
  ${SHEET_URL&&!(IS_OWNER&&DB)&&A.state==='ok'?`<button class="linkbtn" data-act="admout">${esc(t('admOut'))}</button>`:''}
  <div id="adm-list">${A.state==='loading'?`<p class="muted">${esc(t('loading'))}</p>`:A.state==='err'?`<p class="muted">${esc(t('admErr'))}</p>`:A.state==='key'?'':admList()}</div></section>`;
}
async function saveAdmin(){
  const btn=$('axl'),msg=$('msg'),say=m=>{S.msg=m;if(msg)msg.textContent=m;};
  btn.disabled=true;say(t('prep'));
  try{
    const dl=await getSaver();
    const X=window.XLSX,wb=X.utils.book_new(),rows=S.adm.rows;
    const a1=[[t('name'),t('hid'),t('unit'),t('last'),t('cases'),t('overall'),t('result'),t('attempts')]].concat(rows.map(r=>[r.name,r.hid,r.unit,fmtAt(r.updated),r.cases,r.pct+'%',r.pass?'PASS':'NOT YET PASSED',sessN(r.attempts||[])]));
    const w1=X.utils.aoa_to_sheet(a1);w1['!cols']=[{wch:28},{wch:14},{wch:26},{wch:22},{wch:12},{wch:12},{wch:18},{wch:10}];
    const a2=[[t('name'),t('hid'),t('unit'),t('date'),t('cases'),t('overall'),t('result'),t('scen')]];
    rows.forEach(r=>(r.attempts||[]).forEach(a=>a2.push([r.name,r.hid,r.unit,fmtAt(a.at),a.cases,a.pct+'%',a.pass?'PASS':'NOT YET PASSED',(a.list||[]).filter(x=>x&&x.t!==undefined).map(x=>x.t+' ('+x.us+'/'+x.ts+')').join(' | ')])));
    const w2=X.utils.aoa_to_sheet(a2);w2['!cols']=[{wch:28},{wch:14},{wch:26},{wch:22},{wch:12},{wch:12},{wch:18},{wch:80}];
    X.utils.book_append_sheet(wb,w1,t('staff'));X.utils.book_append_sheet(wb,w2,t('attempts'));
    if(S.lang==='ar')wb.Workbook={Views:[{RTL:true}]};
    await dl.save({filename:'MorseFall_All_Staff_Results.xlsx',data:X.write(wb,{bookType:'xlsx',type:'array'})});
    say(t('saved'));
  }catch(err){say(err&&err.code==='declined'?t('declined'):t('err'));}
  const b=$('axl');if(b)b.disabled=false;
}

/* ---------- render + events ---------- */

function persist(){
  try{
    ls.set(SK,JSON.stringify({name:S.name,hid:S.hid,unit:S.unit,res:S.res,order:S.order,plan:S.plan,chgPlan:S.chgPlan,pair:S.pair,t0:S.t0,ext:S.ext,seen6:S.seen6,cur:S.cur,sid:S.sid,
      cases:S.order.concat(Object.values(S.pair)).map(id=>SC.find(x=>x.id===id)).filter(c=>c&&c.gen),at:Date.now()}));
  }catch(e){}
}
function resumeSaved(){
  const d=SAVED;if(!d)return;
  (d.cases||[]).forEach(c=>{if(!SC.find(x=>x.id===c.id)){SC.push(c);const n=+String(baseOf(c.id)).slice(1);if(n>gid)gid=n;}});
  Object.assign(S,{name:d.name||'',hid:d.hid||'',unit:UNITS.some(u=>u[0]===d.unit)?d.unit:'',res:d.res||{},order:d.order||[],plan:d.plan||null,chgPlan:d.chgPlan||null,pair:d.pair||{},t0:d.t0||d.at||Date.now(),ext:!!d.ext,expired:false,seen6:!!d.seen6,sid:d.sid||'',cur:null,draft:[]});
  SAVED=null;if(deadline()<=Date.now()){timeUp();return;}go('hub');
}
function render(){
  $('app').dir=S.lang==='ar'?'rtl':'ltr';
  document.documentElement.lang=S.lang;
  const v=S.view==='start'?vStart():S.view==='how'?vHow():S.view==='prac'?vPrac():S.view==='pracend'?vPracEnd():S.view==='timeup'?vTimeup():S.view==='hub'?vHub():S.view==='play'?vPlay():S.view==='admin'?vAdmin():vReport();
  $('root').innerHTML=topBar()+v+foot()+(S.modal?modalHtml():'');
  if(S.modal){const mc=$('m-cont');if(mc)mc.focus();}
  if(S.order.length&&S.view!=='admin'&&!S.prac)persist();
  if(S.view==='play'&&!S.res[S.cur])syncSubmit();
  if(S.view==='report')fitPages();
}
function syncSubmit(){
  const b=$('sub');if(!b)return;
  const full=ITEMS.every((_,i)=>S.draft[i]!==undefined);
  b.disabled=!full;const h=$('subhint');if(h)h.hidden=full;
}
function go(v){S.view=v;S.msg='';render();window.scrollTo(0,0);}
// hide the video box when the file is missing (error events do not bubble, so listen while capturing)
document.addEventListener('error',e=>{const el=e.target;if(el&&el.tagName==='SOURCE'){const sec=el.closest('section');if(sec)sec.hidden=true;}},true);
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='adm-q'){S.admQ=e.target.value;const l=$('adm-list');if(l)l.innerHTML=admList();return;}
  if(id==='in-name')S.name=e.target.value;else if(id==='in-hid')S.hid=e.target.value;else if(id==='in-unit')S.unit=e.target.value;else return;
  const b=$('go');if(b)b.disabled=!(S.name.trim()&&S.hid.trim()&&S.unit.trim());
});
document.addEventListener('change',e=>{
  if(e.target.matches('input[data-risk]')){const i=+e.target.dataset.risk,on=e.target.checked,set=new Set(PCFG.risks);if(on)set.add(i);else set.delete(i);if(!set.size)set.add(i);PCFG.risks=[...set].sort();render();return;}
  if(e.target.id==='pr-n'){PCFG.n=+e.target.value;return;}
  if(e.target.matches('input[type=radio][data-q]')){S.draft[+e.target.dataset.q]=+e.target.value;syncSubmit();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='lang'){S.lang=v;PREF.lang=v;savePref();render();}
  else if(a==='set'){S.set=!S.set;render();}
  else if(a==='pref'){const k=b.dataset.k;PREF[k]=k==='fs'?+v:v;savePref();applyPrefs();render();}
  else if(a==='resume')resumeSaved();
  else if(a==='fresh'){SAVED=null;ls.del(SK);S.t0=0;S.pair={};render();}
  else if(a==='admp'){S.admP=+v;render();}
  else if(a==='wa'){const u='https://wa.me/?text='+encodeURIComponent(admText());try{window.open(u,'_blank','noopener');}catch(err){}}
  else if(a==='cpy'){const x=admText(),done=()=>{S.msg=t('copied');const m=$('msg');if(m)m.textContent=S.msg;};try{navigator.clipboard.writeText(x).then(done,done);}catch(err){done();}}
  else if(a==='admout'){S.admKey='';ls.del(AK);S.adm={state:'key',rows:[]};render();}
  else if(a==='go')startTest();
  else if(a==='how'){S.back=S.view;go('how');}
  else if(a==='howback')go(S.back&&S.back!=='how'?S.back:'start');
  else if(a==='next'){if(S.prac)nextPrac();else advance();}
  else if(a==='mcont'){S.modal=false;S.seen6=true;S.ext=true;nextCase();}
  else if(a==='prac'){S.view='prac';render();window.scrollTo(0,0);}
  else if(a==='plv'){PCFG.lv=+v;render();}
  else if(a==='pall'){PCFG.risks=[0,1,2];render();}
  else if(a==='pstart')enterPrac();
  else if(a==='pexit')leavePrac('start');
  else if(a==='pend')go('pracend');
  else if(a==='cert')saveFile('cert');
  else if(a==='mfin'){S.modal=false;S.seen6=true;go('report');recordResult();}
  else if(a==='retake')retakeTest();
  else if(a==='hub')go('hub');
  else if(a==='home')go('start');
  else if(a==='open'){S.cur=v;S.draft=S.res[v]?S.res[v].ans.slice():[];S.openAt=Date.now();go('play');}
  else if(a==='submit'){if(ITEMS.every((_,i)=>S.draft[i]!==undefined)){submitCur();render();const f=$('fbk');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});}}
  else if(a==='report'){if(canReport()){go('report');recordResult();}}
  else if(a==='admin'){S.view='admin';loadAdmin();}
  else if(a==='refresh')loadAdmin();
  else if(a==='admkey'){const k=$('adm-key');S.admKey=k?k.value.trim():'';if(S.admKey)loadAdmin();}
  else if(a==='axl')saveAdmin();
  else if(a==='xlsx')saveFile('xlsx');
  else if(a==='pdf')saveFile('pdf');
});

/* ---------- Excel + PDF ---------- */
function buildXlsx(){
  const st=stats(),X=window.XLSX,wb=X.utils.book_new(),ar=S.lang==='ar';
  const sum=[[t('title')],[t('by')],[],
   [t('name'),S.name],[t('hid'),S.hid],[t('unit'),S.unit],[t('date'),fmtDate()],[],
   [t('cases'),st.rows.length],[t('items'),st.ok+' / '+st.tot],[t('overall'),st.pct+'%'],[t('rActive'),fmtDur(analysis().secs)+' '+t('rMin')],[t('passTxt')],[t('result'),st.pass?'PASS - '+t('comp'):'NOT YET PASSED - '+t('rev')]];
  const w1=X.utils.aoa_to_sheet(sum);w1['!cols']=[{wch:28},{wch:46}];
  const h2=['#',t('scen'),t('items'),t('yS'),t('cS'),t('match')+' ('+t('yS')+')',t('match')+' ('+t('cS')+')','Risk match'];
  const r2=st.rows.map((s,i)=>{const r=S.res[s.id];return [i+1,p(s.ti),r.ok+'/6',r.us,r.ts,p(RISK[riskIdx(r.us)].n),p(RISK[riskIdx(r.ts)].n),r.riskOk?'✓':'✗'];});
  const w2=X.utils.aoa_to_sheet([h2].concat(r2));w2['!cols']=[{wch:5},{wch:38},{wch:12},{wch:12},{wch:16},{wch:22},{wch:22},{wch:12}];
  const h3=['#',t('scen'),t('item'),t('yourAns'),t('corrAns'),t('pts'),t('ok')];
  const r3=[];st.rows.forEach((s,i)=>{const r=S.res[s.id];ITEMS.forEach((it,k)=>{r3.push([i+1,p(s.ti),p(it.q),p(it.o[r.ans[k]]),p(it.o[s.a[k]]),it.p[r.ans[k]],same(k,r.ans[k],s.a[k])?'✓':'✗']);});});
  const w3=X.utils.aoa_to_sheet([h3].concat(r3));w3['!cols']=[{wch:5},{wch:36},{wch:34},{wch:30},{wch:30},{wch:9},{wch:9}];
  X.utils.book_append_sheet(wb,w1,t('sSum'));X.utils.book_append_sheet(wb,w2,t('sSc'));X.utils.book_append_sheet(wb,w3,t('sAn'));
  const A=analysis(),w4=X.utils.aoa_to_sheet([[t('item'),t('items'),t('rAcc'),t('rPts')]].concat(A.dom.map(d=>[p(ITEMS[d.i].q),d.ok+'/'+d.n,d.pct+'%',d.pu+' / '+d.pe])));w4['!cols']=[{wch:44},{wch:12},{wch:12},{wch:22}];
  X.utils.book_append_sheet(wb,w4,t('rDom').slice(0,31));
  if(ar)wb.Workbook={Views:[{RTL:true}]};
  return X.write(wb,{bookType:'xlsx',type:'array'});
}
async function buildPdf(){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pages=[...document.querySelectorAll('#paper .pg')];
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'p'});
  for(let k=0;k<pages.length;k++){
    const clone=pages[k].cloneNode(true);
    clone.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;margin:0;zoom:1';
    document.body.appendChild(clone);
    const canvas=await html2canvas(clone,{scale:2,backgroundColor:'#ffffff'});
    clone.remove();
    if(k)pdf.addPage();
    pdf.addImage(canvas.toDataURL('image/jpeg',0.88),'JPEG',0,0,210,297);
  }
  return pdf.output('arraybuffer');
}

function certHtml(){
  S.latin=true;
  try{
    const st=stats(),dir=S.lang==='ar'?'rtl':'ltr';
    return `<div class="cert" dir="${dir}"><div class="cert-in"><img src="${LOGO}" alt="" class="cert-logo"><div class="cert-org">NURSING EDUCATION &amp; STAFF DEVELOPMENT</div><div class="cert-org2">NURSING DEPARTMENT</div>
    <h1>${esc(t('certT'))}</h1><p class="c1">${esc(t('certA'))}</p><div class="cname">${esc(S.name)}</div>
    <p class="c1"><bdi dir="ltr">ID ${esc(S.hid)}</bdi> · ${esc(S.unit)}</p><p class="c2">${esc(t('certB')).replace('100%','<bdi dir="ltr">100%</bdi>')}</p>
    <p class="c1">${esc(t('certD'))}: <bdi dir="ltr">${num(st.rows.length)}</bdi> · ${esc(t('overall'))}: <bdi dir="ltr">${num(st.pct)}%</bdi></p>
    <div class="csig"><div><div class="ln"></div>${esc(t('certE'))}: ${esc(fmtDate())}</div><div><div class="ln"></div>${esc(t('certF'))} · ${esc(t('certC'))}</div></div>
    <div class="cfoot">${esc(t('by'))}</div></div></div>`;
  }finally{S.latin=false;}
}
async function buildCert(){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:1123px;height:794px';box.innerHTML=certHtml();document.body.appendChild(box);
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'l'});
  try{const canvas=await html2canvas(box.firstElementChild,{scale:2,backgroundColor:'#ffffff'});pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,210);}finally{box.remove();}
  return pdf.output('arraybuffer');
}
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function getSaver(){
  const dl=await window.claude?.use?.('downloads');
  if(dl)return dl;
  return {save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return {status:'saved'};}};
}
async function saveFile(kind){
  const btn=$(kind==='xlsx'?'xls':kind==='cert'?'cert':'pdf'),msg=$('msg');
  const say=m=>{S.msg=m;if(msg)msg.textContent=m;};
  btn.disabled=true;say(t('prep'));
  try{
    const dl=await getSaver();
    const safe=String(S.hid).replace(/[^\w-]+/g,'')||'staff';
    const data=kind==='xlsx'?buildXlsx():kind==='cert'?await buildCert():await buildPdf();
    await dl.save({filename:kind==='cert'?`MorseFall_Certificate_${safe}.pdf`:`MorseFall_Results_${safe}.${kind}`,data});
    say(t('saved'));
  }catch(err){
    say(err&&err.code==='declined'?t('declined'):(err&&err.code==='unavailable'?t('noDl'):t('err')));
  }
  btn.disabled=false;
}
render();
